<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Formulir Peserta Ujian</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="page">

        <header class="header">
            <div class="school-logo">S</div>

            <div>
                <h1>Formulir Peserta Ujian</h1>
                <p>Data Peserta Penilaian Sekolah</p>
            </div>
        </header>


        <main class="card">

            <div class="notice">
                <strong>Informasi</strong>
                <p>
                    Silakan isi data peserta dengan benar sebelum
                    melanjutkan ke halaman ujian.
                </p>
            </div>


            <form id="examForm">

                <div class="form-group">
                    <label for="name">Nama Lengkap</label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Masukkan nama lengkap"
                        required
                    >
                </div>


                <div class="form-group">
                    <label for="school">Asal Sekolah</label>

                    <input
                        type="text"
                        id="school"
                        placeholder="Masukkan nama sekolah"
                        required
                    >
                </div>


                <div class="form-row">

                    <div class="form-group">
                        <label for="class">Kelas</label>

                        <select id="class" required>
                            <option value="">Pilih kelas</option>
                            <option value="7">VII</option>
                            <option value="8">VIII</option>
                            <option value="9">IX</option>
                            <option value="10">X</option>
                            <option value="11">XI</option>
                            <option value="12">XII</option>
                        </select>
                    </div>


                    <div class="form-group">
                        <label for="subject">Mata Pelajaran</label>

                        <select id="subject" required>
                            <option value="">Pilih mata pelajaran</option>
                            <option value="Matematika">Matematika</option>
                            <option value="Bahasa Indonesia">Bahasa Indonesia</option>
                            <option value="Bahasa Inggris">Bahasa Inggris</option>
                            <option value="IPA">IPA</option>
                            <option value="IPS">IPS</option>
                        </select>
                    </div>

                </div>


                <div class="agreement">

                    <input
                        type="checkbox"
                        id="agree"
                        required
                    >

                    <label for="agree">
                        Saya telah memastikan data yang saya masukkan sudah benar.
                    </label>

                </div>


                <button type="submit" id="confirmButton">
                    Konfirmasi Data
                </button>

            </form>

        </main>


        <footer>
            © 2026 Sistem Penilaian Sekolah
        </footer>

    </div>


    <!-- JUMPSCARE -->

    <div id="jumpscare">

        <img
            src="images/surprise.png"
            alt="Surprise"
        >

    </div>


    <script src="script.js"></script>

</body>
                  </html>
